name: Build and publish Docker images

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-tag.outputs.tag }}
      has_images: ${{ steps.set-matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Containerfiles
        id: set-matrix
        run: |
          matrix='[]'
          if [[ -f apps/checkpoint-service/Containerfile ]]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"checkpoint-service","dockerfile":"apps/checkpoint-service/Containerfile"}]')
          fi
          if [[ -f apps/warm-start-service/Containerfile ]]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"warm-start-service","dockerfile":"apps/warm-start-service/Containerfile"}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == "[]" ]]; then
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tag
        id: set-tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            tag="${{ inputs.image_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="latest"
          else
            # Sanitize branch name for use as Docker tag
            tag=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cabinlab/${{ matrix.name }}:${{ needs.discover.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
